<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Tudo entre marca:inicio e marca:fim e SUBSTITUIDO quando o host
         pertence a uma marca white label (server/marca-html.ts). O que esta
         aqui e a marca da plataforma, e continua servido byte a byte igual
         quando o host e o dela — a injecao nem roda nesse caso. -->
    <!-- marca:inicio -->
    <title>Consulta ISP — rede colaborativa de crédito para provedores de internet</title>
    <meta name="description" content="Consulte o CPF, o CNPJ ou o endereço na rede colaborativa de provedores antes de instalar: histórico de inadimplência, equipamentos retidos e sugestão de decisão, ao vivo no ERP de cada provedor." />
    <!-- Icones da marca /consulta.isp (brand kit de 10/09/2026). O SVG e o "/c"
         do kit com os glifos CONVERTIDOS EM CONTORNO: o original desenha texto
         com a fonte puxada por @import, e favicon SVG nao carrega recurso
         externo — cairia na monoespacada do sistema. Os PNGs sao os do kit,
         ja renderizados, para quem nao le favicon vetorial.
         O "-v2" no nome e de proposito: navegador, atalho e previa do WhatsApp
         guardam o icone PELO ENDERECO. Trocar so o conteudo de favicon.svg (o
         que foi feito primeiro) deixou o Chrome e o WhatsApp com a marca antiga.
         Proxima troca de arte = proximo sufixo; os nomes velhos continuam
         servindo a arte nova para quem ainda apontar para eles. -->
    <link rel="icon" type="image/svg+xml" href="/marca/favicon-v2.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-v2-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/marca/favicon-v2-192.png" />
    <!-- iOS exige opaco: PNG transparente vira icone com fundo preto. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/marca/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E0D0B" />

    <!-- Previa quando alguem compartilha o link (WhatsApp, LinkedIn): a imagem
         e a do kit, 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Consulta ISP" />
    <meta property="og:title" content="/consulta.isp — rede colaborativa de crédito para provedores de internet" />
    <meta property="og:description" content="Saiba quem não vai pagar antes de instalar. Consulta ao vivo no ERP de toda a rede de provedores: histórico de inadimplência, equipamentos retidos e sugestão de decisão." />
    <meta property="og:image" content="https://consultaisp.com.br/marca/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="/consulta.isp — rede colaborativa de crédito" />
    <meta property="og:url" content="https://consultaisp.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Medicao. O pixel fica DENTRO da faixa da marca de proposito: em host
         white label a faixa inteira e trocada (server/marca-html.ts), e o
         pixel da plataforma nao vai junto. A guarda por hostname cobre o
         revendedor sem marca propria, que herda o cabecalho da casa, e
         mantem localhost e preview fora dos dados.

         O CSP precisou abrir connect.facebook.net em script, e facebook.com
         em img e connect (server/index.ts). Sem isso o snippet carrega e nao
         reporta nada — o unico sinal seria no console do visitante.

         SPA: o PageView abaixo conta a ENTRADA. Troca de rota nao recarrega
         a pagina, entao cada passo do funil precisa ser disparado no codigo. -->
    <script>
      (function () {
        if (!/(^|\.)consultaisp\.com\.br$/.test(location.hostname)) return;
        !function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = [];
          t = b.createElement(e); t.async = !0; t.src = v;
          s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
        }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        fbq("init", "1543850664096239");
        fbq("track", "PageView");
      })();
    </script>
    <noscript><img height="1" width="1" style="display: none" alt=""
      src="https://www.facebook.com/tr?id=1543850664096239&amp;ev=PageView&amp;noscript=1" /></noscript>

    <!-- marca:fim -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- JetBrains Mono entra pela MARCA (wordmark /consulta.isp: 700 no nome,
         500 na tagline) e pela landing. A interface segue em Inter e IBM Plex
         Mono. Montserrat saiu com a marca antiga (10/09/2026). -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Aplica o tema ANTES do primeiro paint, evitando flash de tema errado.
      // Roda antes do React: o toggle so grava a preferencia e recarrega.
      (function () {
        try {
          var t = localStorage.getItem("consultaisp-tema");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) { /* modo privado: segue no tema claro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
